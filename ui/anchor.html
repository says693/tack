<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>tack · 锚点</title>
  <link rel="stylesheet" href="styles/tack.css" />
  <link rel="stylesheet" href="styles/windows.css" />
  <link rel="stylesheet" href="styles/anchor.css" />
  <link rel="stylesheet" href="styles/menus.css" />
</head>
<body class="anchor">
  <div class="anchor-shell" id="shell">
    <header class="anchor-top drag" data-tauri-drag-region>
      <span class="pinhead no-drag"></span>
      <span class="tag tag-fork no-drag"></span>
      <button class="anchor-close no-drag" id="btn-x" title="丢弃">
        <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7"/></svg>
      </button>
    </header>

    <div class="anchor-body" id="body">
      <p class="anchor-kicker kicker" id="kicker">锚点 · 只读</p>

      <div class="name-field" id="name-field">
        <label for="name">给它起个名字（就是一次提取练习）</label>
        <input id="name" type="text" maxlength="60" spellcheck="false" autocomplete="off" />
      </div>

      <h1 class="anchor-line" id="line"></h1>
      <p id="save-status" role="status" aria-live="polite"></p>
      <p id="anchor-error" class="error-banner" role="alert" hidden></p>

      <hr class="hair anchor-rule" />

      <blockquote class="anchor-quote">
        <span id="quote"></span>
        <span class="src" id="src"></span>
      </blockquote>

      <details class="anchor-parent" id="parent-box">
        <summary>原会话脉络</summary>
        <ol id="parent-list"></ol>
      </details>
    </div>

    <footer class="anchor-foot">
      <button class="btn" id="btn-discard">[X] 丢弃</button>
      <button class="btn btn-pin" id="btn-pin">[PIN] 钉住</button>
    </footer>
  </div>
  <script src="js/bridge.js"></script>
  <script src="js/notify.js"></script>
  <script src="js/contextmenu.js"></script>
  <script src="js/anchor.js"></script>
</body>
</html>
