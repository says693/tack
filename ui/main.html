<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>tack · 今日</title>
  <link rel="stylesheet" href="styles/tack.css" />
  <link rel="stylesheet" href="styles/windows.css" />
  <link rel="stylesheet" href="styles/menus.css" />
</head>
<body class="main">
  <div class="main-shell" id="shell">
    <header class="main-top drag" data-tauri-drag-region>
      <span class="wordmark no-drag">tack</span>
      <button class="subject-chip no-drag" id="subject" title="科目管理">
        <span>正在加载</span>
      </button>
      <div class="main-top-right no-drag">
        <span class="stepper" id="stepper">—</span>
        <button class="icon-btn" id="btn-help" title="键位表（?）">
          <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="7" cy="7" r="5.2"/><path d="M5.5 5.6a1.6 1.6 0 1 1 2.3 1.5c-.5.3-.8.6-.8 1.1"/><circle cx="7" cy="10.1" r=".55" fill="currentColor" stroke="none"/></svg>
        </button>
        <button class="icon-btn" id="btn-down" title="最小化">
          <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3 9.5L7 5l4 4.5"/></svg>
        </button>
        <button class="icon-btn" id="btn-close" title="隐藏窗口">
          <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3.5 3.5l7 7M10.5 3.5l-7 7"/></svg>
        </button>
      </div>
    </header>

    <div class="progress"><i id="progress" style="width:18%"></i></div>

    <div class="day-line">
      <span class="day-date" id="day-date"></span>
      <span class="tag" id="day-tag">正在连接内核</span>
    </div>
    <div class="tools">
      <button class="btn data-control" id="btn-import">导入材料</button>
      <button class="btn data-control" id="btn-refresh">刷新</button>
      <form id="search-form">
        <input id="search-query" aria-label="搜索已导入内容" placeholder="搜索原文" maxlength="300" required />
        <button class="btn data-control" type="submit">搜索</button>
      </form>
    </div>
    <div id="error" class="error-banner" role="alert" hidden></div>

    <main class="stream" id="stream" aria-label="今日复习卡"></main>

    <footer class="main-foot">
      <span class="foot-hint" id="foot-hint" role="status" aria-live="polite">正在读取真实学习数据</span>
      <div class="foot-actions">
        <button class="btn data-control" id="btn-later">明天再看</button>
        <button class="btn btn-pin data-control" id="btn-solid">记住了</button>
      </div>
    </footer>

    <div class="drop-veil" id="veil"><p>松手导入教材</p></div>
    <div class="longpress-hint" id="press-hint">[s] 长按中 · 松开即开锚点窗</div>
  </div>
  <dialog id="subject-dialog" class="app-dialog">
    <form method="dialog"><button class="btn dialog-close" aria-label="关闭科目管理">关闭</button></form>
    <h2>科目与已暂停卡片</h2>
    <label for="subject-select">当前科目</label>
    <select id="subject-select"></select>
    <form id="create-subject-form">
      <label for="new-subject">创建科目</label>
      <input id="new-subject" maxlength="40" required placeholder="例如：细胞生物学" />
      <button class="btn data-control">创建并切换</button>
    </form>
    <p id="data-location" class="config-hint"></p>
    <p class="config-hint">默认是明确的离线模式。在线模式须在配置文件设置 mode、HTTPS 端点和模型，密钥只用 TACK_API_KEY 或系统凭据管理器。</p>
    <div id="suspended-list"></div>
  </dialog>
  <dialog id="search-dialog" class="app-dialog">
    <form method="dialog"><button class="btn dialog-close" aria-label="关闭搜索结果">关闭</button></form>
    <h2>原文搜索</h2>
    <div id="search-results"></div>
  </dialog>
  <script src="js/bridge.js"></script>
  <script src="js/longpress.js"></script>
  <script src="js/notify.js"></script>
  <script src="js/contextmenu.js"></script>
  <script src="js/keys.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
