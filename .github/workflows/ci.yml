name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: stable
      - run: npm ci
      - name: Typecheck and build frontend
        run: npm run build
      - name: Frontend unit tests
        run: npm test
      - name: Install test browser
        run: npx playwright install msedge
      - name: Browser workflow regressions
        run: npm run test:e2e
      - name: Rust unit and persistence tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
