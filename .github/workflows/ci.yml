name: verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
          cache: npm
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: 0.12.17
          python-version: 3.12.14
          enable-cache: true
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: 1.98.0
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: uv sync --project core --frozen --group build
      - name: Core and subprocess regressions
        working-directory: core
        run: uv run --frozen python -m unittest discover -s tests -v
      - name: UI regressions
        run: npm test
      - name: Build bundled Python runtime
        run: npm run build:core
      - name: Frozen executable contract
        run: uv run --project core --frozen python scripts/test-bundled-core.py
      - name: Rust compile gate
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml
