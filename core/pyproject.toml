[project]
name = "tack-core"
version = "0.1.1"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pypdf>=6,<7",
  "openai>=2,<3",
  "pydantic>=2,<3",
  "keyring>=25,<26",
  "platformdirs>=4,<5",
  "semantic-text-splitter>=0.28,<0.30",
]

[dependency-groups]
build = ["pyinstaller>=6,<7"]

[tool.uv]
package = false
